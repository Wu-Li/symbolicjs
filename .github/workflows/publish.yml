name: Publish

# Full verification runs locally in the pre-commit hook (see AGENTS.md). This workflow
# only publishes: when a push to main carries a version that is not yet on npm, it runs
# a packaging safety net, publishes with provenance, and tags the release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish unpublished version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Read package identity
        id: package
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';

          const {name, version} = JSON.parse(readFileSync('package.json', 'utf8'));
          console.log(`name=${name}`);
          console.log(`version=${version}`);
          NODE
      - name: Check npm registry
        id: registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          registry_stdout="$(mktemp)"
          registry_stderr="$(mktemp)"
          trap 'rm -f "$registry_stdout" "$registry_stderr"' EXIT

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version \
            >"$registry_stdout" 2>"$registry_stderr"; then
            published="$(tr -d '[:space:]' < "$registry_stdout")"
            if [[ "$published" != "$PACKAGE_VERSION" ]]; then
              cat "$registry_stderr" >&2
              echo "::error::npm returned unexpected version: $published"
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; nothing to do."
          else
            registry_status=$?
            if grep -q 'E404' "$registry_stdout" "$registry_stderr"; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet."
            else
              cat "$registry_stdout" "$registry_stderr" >&2
              exit "$registry_status"
            fi
          fi
      - name: Install dependencies
        if: steps.registry.outputs.published == 'false'
        run: npm ci
      - name: Validate release metadata
        if: steps.registry.outputs.published == 'false'
        run: npm run test:release
      - name: Build package
        if: steps.registry.outputs.published == 'false'
        run: npm run build
      - name: Packed consumer safety net
        if: steps.registry.outputs.published == 'false'
        run: npm run test:pack
      - name: Publish to npm
        if: steps.registry.outputs.published == 'false'
        run: npm publish --provenance --access public
      - name: Tag and create GitHub Release
        if: steps.registry.outputs.published == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "v${PACKAGE_VERSION}" \
            --target "$GITHUB_SHA" \
            --title "v${PACKAGE_VERSION}" \
            --generate-notes
