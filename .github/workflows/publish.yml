name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false
      - name: Read package identity
        id: package
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';

          const {name, version} = JSON.parse(readFileSync('package.json', 'utf8'));
          console.log(`name=${name}`);
          console.log(`version=${version}`);
          NODE
      - name: Validate release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [[ "$RELEASE_TAG" != "$PACKAGE_VERSION" && "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$PACKAGE_VERSION'."
            exit 1
          fi
      - name: Validate release metadata
        run: npm run test:release
      - name: Check npm registry
        id: registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          registry_stdout="$(mktemp)"
          registry_stderr="$(mktemp)"
          trap 'rm -f "$registry_stdout" "$registry_stderr"' EXIT

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version \
            >"$registry_stdout" 2>"$registry_stderr"; then
            published="$(tr -d '[:space:]' < "$registry_stdout")"
            if [[ "$published" != "$PACKAGE_VERSION" ]]; then
              cat "$registry_stderr" >&2
              echo "::error::npm returned unexpected version: $published"
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; nothing to do."
          else
            registry_status=$?
            if grep -q 'E404' "$registry_stdout" "$registry_stderr"; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet."
            else
              cat "$registry_stdout" "$registry_stderr" >&2
              exit "$registry_status"
            fi
          fi

  verify:
    name: Verify unpublished version
    needs: release
    if: needs.release.outputs.published == 'false'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified package
    needs: [release, verify]
    if: needs.release.outputs.published == 'false' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Publish to npm
        run: npm publish --provenance --access public
