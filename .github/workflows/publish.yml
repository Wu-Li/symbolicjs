name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Read package identity
        id: package
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';

          const {name, version} = JSON.parse(readFileSync('package.json', 'utf8'));
          console.log(`name=${name}`);
          console.log(`version=${version}`);
          NODE
      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          expected="v${PACKAGE_VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION. Expected $expected."
            exit 1
          fi
      - name: Validate manual release source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual publishing is only allowed from main."
            exit 1
          fi
      - name: Validate release metadata
        run: npm run test:release
      - name: Check npm registry
        id: registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if published="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null)"; then
            published="$(printf '%s' "$published" | tr -d '[:space:]')"
            if [[ "$published" == "$PACKAGE_VERSION" ]]; then
              echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} is already published. Bump the version before publishing again."
              exit 1
            fi
            echo "::error::npm returned unexpected version: $published"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify package
        run: npm run check
      - name: Publish to npm
        run: npm publish --provenance --access public
