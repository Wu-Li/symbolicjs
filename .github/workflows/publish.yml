name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - scripts/verify-release.mjs
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - id: package
        name: Read package identity
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';

          const {name, version} = JSON.parse(readFileSync('package.json', 'utf8'));
          console.log(`name=${name}`);
          console.log(`version=${version}`);
          NODE
      - id: registry
        name: Check npm registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          published="$(
            npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --json 2>/dev/null || true
          )"
          if [[ "$published" == "\"${PACKAGE_VERSION}\"" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public
      - name: Ensure matching Git tag
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="v${PACKAGE_VERSION}"
          git fetch --force --tags origin

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tagged_sha="$(git rev-list -n 1 "${tag}")"
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::${tag} points to ${tagged_sha}, expected ${GITHUB_SHA}"
              exit 1
            fi
            exit 0
          fi

          git tag "${tag}" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"
